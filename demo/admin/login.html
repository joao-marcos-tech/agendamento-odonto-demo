<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · Recepção (demo)</title>
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<script src="/assets/js/demo/servidor.js?v=1"></script>
<link rel="icon" href="/assets/img/marca.svg" type="image/svg+xml">
</head>
<body class="pg-login">
<main class="login">
  <div class="login-arte" aria-hidden="true">
    <p class="login-frase">A agenda inteira,<br><em>numa tela só.</em></p>
  </div>
  <form class="login-form" id="login" autocomplete="off">
    <p class="login-marca"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 30c0-14 6-22 14-22s14 8 14 22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="20" cy="28" r="3.4" fill="currentColor"/></svg> Esmalte · Recepção</p>
    <h1>Entrar</h1>
    <p class="login-demo">Demonstração. Os pacientes da agenda são fictícios. Os dados de acesso abaixo são públicos e valem só para esta demo: no sistema real, cada clínica cria a própria senha na instalação.</p>
    <p class="erro" id="erro" role="alert" hidden></p>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" type="text" required maxlength="40" value="recepcao" autocapitalize="none" spellcheck="false">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="text" required maxlength="200" value="demo-esmalte" spellcheck="false">
    <button class="b b-lima b-largo" type="submit">Entrar na demonstração</button>
    <a class="voltar" href="/">← Voltar para o site</a>
  </form>
</main>
<script src="/assets/js/demo/paginas.js?v=1" defer></script>
</body>
</html>
